name: Päivitä lounaslistat (Kokkola ja Tampere)

on:
  # Ajetaan arkisin (ma-pe) 04:17, 06:43, 07:51 ja 09:23 UTC eli
  # talviaikaan noin klo 6.17, 8.43, 9.51 ja 11.23 (kesäaikaan tunnin myöhemmin).
  # Myöhemmät ajot poimivat listat, jotka ravintolat julkaisevat vasta aamulla.
  # Ajat ovat tarkoituksella muualla kuin tasatunneilla: GitHub viivästää ja
  # joskus jättää väliin tasatunnin ajoja. Viimeinen ajo on varmistus.
  schedule:
    - cron: "17 4 * * 1-5"
    - cron: "43 6 * * 1-5"
    - cron: "51 7 * * 1-5"
    - cron: "23 9 * * 1-5"

  # Mahdollistaa päivityksen käynnistämisen myös käsin GitHubin Actions-välilehdeltä
  workflow_dispatch:

# Annetaan automaatiolle oikeus tallentaa päivittyneet lounasdatat repositorioon
permissions:
  contents: write

# Vain yksi päivitys kerrallaan, jotta kaksi ajoa ei yritä tallentaa samaan aikaan
concurrency:
  group: lounasdata
  cancel-in-progress: false

jobs:
  update-lunch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Haetaan repositorion tiedostot
        uses: actions/checkout@v4

      - name: Asennetaan Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asennetaan tarvittavat kirjastot
        run: pip install requests beautifulsoup4 pypdf

      - name: Ajetaan ruokalistojen hakuskripti
        run: python update_menus.py

      - name: Tallennetaan päivittyneet lounasdatat GitHubiin
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lounasdata.json lounasdata-tampere.json
          git diff --staged --quiet && exit 0
          git commit -m "Automaattinen lounaslistojen päivitys"
          # Uusi yritys, jos main muuttui ajon aikana
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
