name: Päivitä lounaslistat (Kokkola ja Tampere)

on:
  # Ajetaan arkisin (ma-pe) 04:30, 07:00 ja 08:00 UTC eli
  # kesäaikaan klo 7.30, 10.00 ja 11.00 ja talviaikaan klo 6.30, 9.00 ja 10.00.
  # Myöhemmät ajot poimivat listat, jotka ravintolat julkaisevat vasta aamulla.
  schedule:
    - cron: "30 4 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "0 8 * * 1-5"

  # Mahdollistaa päivityksen käynnistämisen myös käsin GitHubin Actions-välilehdeltä
  workflow_dispatch:

# Annetaan automaatiolle oikeus tallentaa päivittyneet lounasdatat repositorioon
permissions:
  contents: write

jobs:
  update-lunch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Haetaan repositorion tiedostot
        uses: actions/checkout@v4

      - name: Asennetaan Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asennetaan tarvittavat kirjastot
        run: pip install requests beautifulsoup4 pypdf

      - name: Ajetaan ruokalistojen hakuskripti
        run: python update_menus.py

      - name: Tallennetaan päivittyneet lounasdatat GitHubiin
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lounasdata.json lounasdata-tampere.json
          git diff --staged --quiet || (git commit -m "Automaattinen lounaslistojen päivitys" && git pull --rebase && git push)
