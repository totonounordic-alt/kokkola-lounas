name: Debug sources (temporary)
on:
  push:
    branches: [claude/debug-sources]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch John Scott's
        run: |
          mkdir -p js
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36"
          T=$(date +%s)
          while read name url; do
            [ -z "$name" ] && continue
            curl -sSL -A "$UA" -H "Accept-Language: fi-FI,fi;q=0.9" -H "Cache-Control: no-cache" -H "Pragma: no-cache" -D "js/$name.headers" -o "js/$name" -w "$name %{http_code} %{size_download} %{url_effective}\n" "$url" >> js/status.txt 2>&1 || echo "$name FAIL" >> js/status.txt
          done <<LIST
          lunch.html https://johnscotts.se/ratina/john-scotts-lunch/
          lunch_nocache.html https://johnscotts.se/ratina/john-scotts-lunch/?nocache=$T
          ratina.html https://johnscotts.se/ratina/
          ratina_nocache.html https://johnscotts.se/ratina/?nocache=$T
          fi_ratina.html https://www.johnscotts.fi/ratina/
          fi_lunch.html https://www.johnscotts.fi/ratina/lounas/
          li.html https://www.lounaat.info/lounas/john-scotts-ratina/tampere
          wpjson.json https://johnscotts.se/ratina/wp-json/wp/v2/pages?slug=john-scotts-lunch
          LIST
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f js && git commit -qm "js-dump" && git push
